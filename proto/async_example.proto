syntax = "proto3";

package asyncdemo;

option cc_generic_services = true;

message VerifyRequest
{
    string user_name = 1;
    string password = 2;
}

message VerifyResponse
{
    int32 code = 1;
    string info = 2;
    bool passed = 3;
}

// 服务 B：提供下游认证能力。
service AuthService
{
    rpc Verify(VerifyRequest) returns (VerifyResponse);
}

message CreateOrderRequest
{
    string user_name = 1;
    string password = 2;
    uint32 product_id = 3;
}

message CreateOrderResponse
{
    int32 code = 1;
    string info = 2;
    string order_id = 3;
}

// 服务 A：接收 Consumer 请求，并异步调用服务 B。
service OrderService
{
    rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
}
