# rpc节点的ip地址
rpcserverip=127.0.0.1     
# rpc节点的port端口号
rpcserverport=8000
# zk的ip地址
zookeeperip=127.0.0.1
# zk的port端口号
zookeeperport=2181

# 日志输出目录（相对于程序启动目录）
log_path=./log/
# 日志文件前缀
log_prefix=coroutine_rpc
# 单个日志文件最大大小，单位 MB
log_max_file_size=5
# 框架日志和业务日志级别：DEBUG/INFO/WARN/ERROR/NONE
rpc_log_level=DEBUG
app_log_level=DEBUG
# 日志批量刷新间隔，单位 ms
log_sync_interval=500
